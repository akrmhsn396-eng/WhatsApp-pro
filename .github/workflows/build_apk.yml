name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and build web app
        run: |
          npm install --force
          npm run build

      - name: Configure and Add Capacitor Android
        run: |
          npm install --force @capacitor/core @capacitor/cli @capacitor/android
          
          if [ ! -f "capacitor.config.json" ]; then
            echo '{
              "appId": "com.akram.whatsapppro",
              "appName": "WhatsApp Pro",
              "webDir": "dist",
              "bundledWebRuntime": false
            }' > capacitor.config.json
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # حل جذري لمنع تعارض إصدارات Kotlin في Gradle
          echo "configurations.all { resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22', 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22' }" >> android/app/build.gradle

          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
